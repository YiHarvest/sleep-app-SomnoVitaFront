name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select publish directory
        id: dir
        shell: bash
        run: |
          if [ -d "docs" ]; then
            echo "dir=docs" >> "$GITHUB_OUTPUT"
          elif [ -d "unpackage/dist/build/h5" ]; then
            echo "dir=unpackage/dist/build/h5" >> "$GITHUB_OUTPUT"
          elif [ -d "unpackage/dist/h5" ]; then
            echo "dir=unpackage/dist/h5" >> "$GITHUB_OUTPUT"
          else
            echo "dir=docs" >> "$GITHUB_OUTPUT"
            mkdir -p docs
            cat > docs/index.html <<'HTML'
            <!doctype html>
            <html lang="zh-CN">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>SomnoVita 睡眠健康管理小程序</title>
              <style>
                body{font-family:system-ui,-apple-system,Segoe UI,Roboto;padding:24px;max-width:1080px;margin:0 auto;line-height:1.6}
                .hero{text-align:center;margin:40px 0}
                .screenshot-placeholder{width:100%;max-width:600px;margin:24px auto;background:#f5f5f7;border-radius:12px;padding:40px;text-align:center}
                code{background:#f5f5f7;padding:2px 6px;border-radius:6px}
              </style>
            </head>
            <body>
              <div class="hero">
                <h1>SomnoVita 睡眠健康管理小程序</h1>
                <p>基于 uni-app Vue3 开发的睡眠健康管理微信小程序</p>
              </div>
              <div class="screenshot-placeholder">
                <p>项目截图占位</p>
                <p>后续将展示 AI 助手、睡眠监测等核心页面</p>
              </div>
              <p>要查看实际 H5 预览，请使用 HBuilderX 打包 H5，并将 <code>unpackage/dist/build/h5</code> 推送到 main 分支。</p>
            </body>
            </html>
            HTML
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.dir.outputs.dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
